[package]
name = "taped"
version = "1.4.0"
edition = "2024"
description = "A lightweight cursor for non-linear parsing of slices."
license = "MIT"
repository = "https://github.com/aeckar/taped"
readme = "README.md"
keywords = ["iter", "cursor", "pointer"]
categories = ["parsing", "data-structures"]

[dependencies]
memchr = { version = "2.8.1", optional = true }

[features]
default = ["intrinsics"]
intrinsics = ["dep:memchr"]
